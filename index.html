<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campeonato Ping Pong</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f3; --surface: #ffffff;
    --border: #e0ddd6; --border-strong: #c8c5bc;
    --text: #1a1a18; --text-secondary: #6b6b67; --text-tertiary: #9e9e99;
    --radius: 12px; --radius-sm: 8px;
    --t0-bg: #E6F1FB; --t0-color: #0C447C; --t0-border: #378ADD;
    --t1-bg: #EEEDFE; --t1-color: #3C3489; --t1-border: #534AB7;
    --t2-bg: #E1F5EE; --t2-color: #085041; --t2-border: #1D9E75;
    --green: #1D9E75; --red: #E24B4A;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  .header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 12px; }
  .header-icon { width: 36px; height: 36px; border-radius: 50%; background: #E6F1FB; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header p { font-size: 12px; color: var(--text-secondary); }
  .sync-indicator { margin-left: auto; font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); transition: background 0.3s; flex-shrink: 0; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: var(--red); }
  .sync-dot.loading { background: #EF9F27; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .container { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  .card-title { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1rem; }
  .teams-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
  .team-btn { padding: 10px 6px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-strong); background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); text-align: center; transition: all 0.15s; line-height: 1.4; }
  .team-btn:hover { background: var(--bg); }
  .team-btn.active.t0 { background: var(--t0-bg); color: var(--t0-color); border: 2px solid var(--t0-border); }
  .team-btn.active.t1 { background: var(--t1-bg); color: var(--t1-color); border: 2px solid var(--t1-border); }
  .team-btn.active.t2 { background: var(--t2-bg); color: var(--t2-color); border: 2px solid var(--t2-border); }
  .hint { font-size: 13px; color: var(--text-tertiary); padding: 4px 0; }
  .matchup { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .matchup-name { font-size: 13px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .matchup-name.right { text-align: right; }
  .score-wrap { display: flex; align-items: center; gap: 6px; }
  .score-wrap input { width: 52px; text-align: center; font-size: 16px; font-weight: 600; padding: 7px 4px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-strong); background: var(--bg); color: var(--text); -moz-appearance: textfield; }
  .score-wrap input::-webkit-outer-spin-button, .score-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .score-sep { font-size: 14px; color: var(--text-tertiary); font-weight: 600; }
  .btn-primary { width: 100%; padding: 11px; border-radius: var(--radius-sm); border: none; background: var(--text); color: var(--surface); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.82; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .standings-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  .standings-table th { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-align: center; padding: 0 4px 10px; border-bottom: 0.5px solid var(--border); }
  .standings-table th.left { text-align: left; }
  .standings-table td { padding: 11px 4px; text-align: center; border-bottom: 0.5px solid var(--border); color: var(--text); }
  .standings-table td.left { text-align: left; font-weight: 500; }
  .standings-table tr:last-child td { border-bottom: none; }
  .rank { color: var(--text-tertiary); font-size: 11px; margin-right: 4px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .dp-pos { color: var(--green); font-weight: 600; }
  .dp-neg { color: var(--red); font-weight: 600; }
  .history-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 6px; }
  .history-item:last-child { margin-bottom: 0; }
  .history-teams { font-size: 13px; font-weight: 500; color: var(--text); }
  .history-date { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }
  .winner-tag { font-size: 11px; padding: 2px 7px; border-radius: 20px; background: #EAF3DE; color: #27500A; margin-left: 6px; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--text-tertiary); font-size: 16px; padding: 2px 8px; border-radius: 6px; line-height: 1; flex-shrink: 0; }
  .del-btn:hover { background: #FCEBEB; color: var(--red); }
  .empty { font-size: 13px; color: var(--text-tertiary); padding: 4px 0; }
  .loading-state { text-align: center; padding: 1.5rem 0; color: var(--text-tertiary); font-size: 13px; }
  .error-banner { background: #FCEBEB; color: #791F1F; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 1rem; border: 0.5px solid #F09595; line-height: 1.5; }
  .h2h-block { margin-bottom: 1.1rem; }
  .h2h-block:last-child { margin-bottom: 0; }
  .h2h-team-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .h2h-row { display: flex; align-items: center; gap: 0; background: var(--bg); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 5px; }
  .h2h-opponent { font-size: 12px; font-weight: 500; color: var(--text-secondary); width: 88px; flex-shrink: 0; padding: 8px 10px; line-height: 1.3; }
  .h2h-bar-wrap { flex: 1; display: flex; height: 32px; overflow: hidden; }
  .h2h-bar-w { display: flex; align-items: center; justify-content: flex-end; padding-right: 7px; font-size: 12px; font-weight: 700; color: #fff; min-width: 0; }
  .h2h-bar-l { display: flex; align-items: center; justify-content: flex-start; padding-left: 7px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.85); min-width: 0; }
  .h2h-bar-zero { background: var(--border); flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-tertiary); }
  .h2h-stats { width: 62px; flex-shrink: 0; text-align: right; padding: 8px 10px; font-size: 11px; color: var(--text-tertiary); line-height: 1.5; }
  .h2h-divider { height: 0.5px; background: var(--border); margin: 12px 0; }
  .h2h-no-data { font-size: 13px; color: var(--text-tertiary); }
  @media (max-width: 480px) {
    .teams-grid { grid-template-columns: 1fr; }
    .container { padding: 1rem 0.75rem; }
    .header { padding: 0.9rem 1rem; }
    .h2h-opponent { width: 72px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🏓</div>
  <div>
    <h1>Campeonato Ping Pong</h1>
    <p>Agus/Martin · Gonza/Fran · Alan/Hernán</p>
  </div>
  <div class="sync-indicator">
    <div class="sync-dot loading" id="sync-dot"></div>
    <span id="sync-label">Conectando...</span>
  </div>
</div>

<div class="container">

  <div id="error-banner" style="display:none" class="error-banner"></div>

  <div class="card">
    <div class="card-title">Nuevo partido</div>
    <div class="teams-grid">
      <button class="team-btn t0" onclick="toggleTeam(0)">Agus /<br>Martin</button>
      <button class="team-btn t1" onclick="toggleTeam(1)">Gonza /<br>Fran</button>
      <button class="team-btn t2" onclick="toggleTeam(2)">Alan /<br>Hernán</button>
    </div>
    <div id="form-area">
      <p class="hint">Seleccioná al menos 2 parejas para cargar un resultado</p>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Tabla de posiciones</div>
    <div id="standings-area"><div class="loading-state">Cargando...</div></div>
  </div>

  <div class="card">
    <div class="card-title">Historial de partidos</div>
    <div id="history-area"><div class="loading-state">Cargando...</div></div>
  </div>

  <div class="card">
    <div class="card-title">Head to Head</div>
    <div id="h2h-area"><div class="loading-state">Cargando...</div></div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySHOHQg675x0EHXDV-q7RdBdcY2FCg8kjYYMuOozVTbJc9fqP7WlJWZ6DdBVRgtndU/exec';

const TEAMS = [
  { name: 'Agus / Martin', short: 'Agus/Martin', dot: '#378ADD' },
  { name: 'Gonza / Fran',  short: 'Gonza/Fran',  dot: '#534AB7' },
  { name: 'Alan / Hernán', short: 'Alan/Hernán', dot: '#1D9E75' },
];

let selected = [];
let matches = [];

function setSyncState(state, label) {
  document.getElementById('sync-dot').className = 'sync-dot ' + state;
  document.getElementById('sync-label').textContent = label;
}
function showError(msg) {
  const b = document.getElementById('error-banner');
  b.style.display = msg ? 'block' : 'none';
  b.textContent = msg;
}

async function loadMatches() {
  setSyncState('loading', 'Cargando...');
  showError('');
  try {
    const res = await fetch(SCRIPT_URL, { redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    matches = data.map(r => ({
      ts: Number(r.ts),
      a: TEAMS.findIndex(t => t.name === r.equipo_a),
      b: TEAMS.findIndex(t => t.name === r.equipo_b),
      sa: Number(r.score_a),
      sb: Number(r.score_b),
    })).filter(r => r.a >= 0 && r.b >= 0);
    setSyncState('ok', 'Sincronizado');
    showError('');
  } catch(e) {
    setSyncState('err', 'Sin conexión');
    showError('No se pudo conectar. Verificá que el Apps Script esté publicado como "Cualquier persona" en Implementar → Administrar implementaciones.');
  }
  renderStandings();
  renderHistory();
}

async function sendGet(params) {
  const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  await fetch(url, { mode: 'no-cors', redirect: 'follow' });
}

function toggleTeam(idx) {
  const i = selected.indexOf(idx);
  if (i === -1) selected.push(idx); else selected.splice(i, 1);
  selected.sort();
  document.querySelectorAll('.team-btn').forEach((b, i) => b.classList.toggle('active', selected.includes(i)));
  renderForm();
}

function renderForm() {
  const area = document.getElementById('form-area');
  if (selected.length < 2) {
    area.innerHTML = '<p class="hint">Seleccioná al menos 2 parejas para cargar un resultado</p>';
    return;
  }
  const pairs = [];
  for (let i = 0; i < selected.length; i++)
    for (let j = i+1; j < selected.length; j++)
      pairs.push([selected[i], selected[j]]);

  let html = '';
  pairs.forEach(([a, b], pi) => {
    html += `<div class="matchup" data-a="${a}" data-b="${b}">
      <span class="matchup-name">${TEAMS[a].short}</span>
      <div class="score-wrap">
        <input type="number" min="0" id="sa_${pi}" placeholder="0">
        <span class="score-sep">–</span>
        <input type="number" min="0" id="sb_${pi}" placeholder="0">
      </div>
      <span class="matchup-name right">${TEAMS[b].short}</span>
    </div>`;
  });
  html += `<button class="btn-primary" id="save-btn" onclick="saveMatch()">Guardar partido</button>`;
  area.innerHTML = html;
}

async function saveMatch() {
  const rows = document.querySelectorAll('#form-area .matchup');
  const results = [];
  let valid = true;
  rows.forEach((row, pi) => {
    const a = parseInt(row.dataset.a), b = parseInt(row.dataset.b);
    const sa = parseInt(document.getElementById(`sa_${pi}`).value);
    const sb = parseInt(document.getElementById(`sb_${pi}`).value);
    if (isNaN(sa) || isNaN(sb) || sa < 0 || sb < 0 || sa === sb) { valid = false; return; }
    results.push({ a, b, sa, sb });
  });
  if (!valid || results.length === 0) { alert('Completá todos los resultados. No puede haber empates.'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Guardando...';
  setSyncState('loading', 'Guardando...'); showError('');

  const ts = Date.now();
  try {
    for (const r of results) {
      await sendGet({ action: 'add', ts, equipo_a: TEAMS[r.a].name, equipo_b: TEAMS[r.b].name, score_a: r.sa, score_b: r.sb });
    }
    selected = [];
    document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
    renderForm();
    await new Promise(r => setTimeout(r, 1800));
    await loadMatches();
  } catch(e) {
    setSyncState('err', 'Error al guardar');
    showError('No se pudo guardar. Verificá la conexión.');
    btn.disabled = false; btn.textContent = 'Guardar partido';
  }
}

async function deleteMatch(ts) {
  if (!confirm('¿Borrar este partido?')) return;
  setSyncState('loading', 'Borrando...'); showError('');
  try {
    await sendGet({ action: 'delete', ts });
    await new Promise(r => setTimeout(r, 1800));
    await loadMatches();
  } catch(e) {
    setSyncState('err', 'Error al borrar');
  }
}

function renderStandings() {
  const stats = TEAMS.map((_, i) => ({ idx: i, pj: 0, g: 0, p: 0, pf: 0, pc: 0 }));
  matches.forEach(m => {
    const a = stats[m.a], b = stats[m.b];
    a.pj++; b.pj++; a.pf += m.sa; a.pc += m.sb; b.pf += m.sb; b.pc += m.sa;
    if (m.sa > m.sb) { a.g++; b.p++; } else { b.g++; a.p++; }
  });
  stats.sort((x, y) => y.g !== x.g ? y.g - x.g : (y.pf - y.pc) - (x.pf - x.pc));
  const rows = stats.map((s, rank) => {
    const dp = s.pf - s.pc;
    const dpStr = s.pj === 0 ? '–' : (dp > 0 ? '+' + dp : String(dp));
    const dpClass = dp > 0 ? 'dp-pos' : dp < 0 ? 'dp-neg' : '';
    return `<tr>
      <td class="left"><span class="rank">${rank+1}.</span><span class="dot" style="background:${TEAMS[s.idx].dot}"></span>${TEAMS[s.idx].short}</td>
      <td>${s.pj}</td><td>${s.g}</td><td>${s.p}</td><td>${s.pf}</td><td>${s.pc}</td>
      <td class="${dpClass}">${dpStr}</td></tr>`;
  }).join('');
  document.getElementById('standings-area').innerHTML = `
    <table class="standings-table">
      <thead><tr>
        <th class="left" style="width:36%">Pareja</th>
        <th style="width:10%">PJ</th><th style="width:10%">G</th><th style="width:10%">P</th>
        <th style="width:10%">PF</th><th style="width:10%">PC</th><th style="width:14%">DP</th>
      </tr></thead><tbody>${rows}</tbody>
    </table>`;
}

function renderHistory() {
  const area = document.getElementById('history-area');
  if (matches.length === 0) { area.innerHTML = '<p class="empty">Todavía no hay partidos cargados</p>'; return; }
  const grouped = {};
  matches.forEach(m => { if (!grouped[m.ts]) grouped[m.ts] = []; grouped[m.ts].push(m); });
  const tsList = Object.keys(grouped).map(Number).sort((a, b) => b - a);
  let html = '';
  tsList.forEach(ts => {
    grouped[ts].forEach(m => {
      const winner = m.sa > m.sb ? TEAMS[m.a].short : TEAMS[m.b].short;
      const date = new Date(ts).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' });
      html += `<div class="history-item">
        <div>
          <div class="history-teams">${TEAMS[m.a].short} ${m.sa} – ${m.sb} ${TEAMS[m.b].short}<span class="winner-tag">Gana ${winner}</span></div>
          <div class="history-date">${date}</div>
        </div>
        <button class="del-btn" onclick="deleteMatch(${ts})">✕</button>
      </div>`;
    });
  });
  area.innerHTML = html;
}

loadMatches();
</script>
</body>
</html>
