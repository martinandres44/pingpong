<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patrimonio Martín</title>

    <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Patrimonio Martín&quot;,&quot;short_name&quot;:&quot;Patrimonio&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#080c14&quot;,&quot;theme_color&quot;:&quot;#3b82f6&quot;}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Patrimonio Martín">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #080c14;
            --surface: #0d1525;
            --surface2: #121d30;
            --surface3: #192338;
            --border: #1e2d45;
            --border-bright: #2a3f5f;
            --text: #e8f0fe;
            --text-muted: #6b82a8;
            --text-dim: #3d5275;
            --accent: #3b82f6;
            --accent-bright: #60a5fa;
            --accent-dim: rgba(59,130,246,0.15);
            --green: #10b981;
            --green-dim: rgba(16,185,129,0.15);
            --red: #ef4444;
            --red-dim: rgba(239,68,68,0.12);
            --amber: #f59e0b;
            --amber-dim: rgba(245,158,11,0.15);
            --slate: #64748b;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ─── BACKGROUND GRID ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 16px 14px 60px; }

        /* ─── HEADER ─── */
        .header {
            background: linear-gradient(135deg, var(--surface2) 0%, var(--surface) 100%);
            border: 1px solid var(--border-bright);
            border-radius: 18px;
            padding: 28px 24px 22px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .header-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .header-total {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: clamp(2.4rem, 8vw, 3.6rem);
            font-weight: 400;
            color: #fff;
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .header-dc {
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            margin-top: 8px;
        }
        .header-gan {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 20px;
        }
        .header-gan-total {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 400;
            letter-spacing: -0.3px;
            line-height: 1.1;
        }
        .header-gan-total.pos { color: var(--green); }
        .header-gan-total.neg { color: var(--red); }
        .header-gan-pct {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .header-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        #sync-info {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .header-refresh {
            margin-left: auto;
            background: var(--accent-dim);
            border: 1px solid rgba(59,130,246,0.3);
            color: var(--accent-bright);
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Sora', sans-serif;
            letter-spacing: 0.5px;
        }
        .header-refresh:hover { background: rgba(59,130,246,0.25); }

        /* ─── SUMMARY PILLS ─── */
        .summary-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .sum-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            text-align: center;
            transition: border-color 0.2s;
        }
        .sum-pill:hover { border-color: var(--border-bright); }
        .sum-pill-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .sum-pill-val {
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
        }
        @media(max-width:480px){
            .summary-strip { grid-template-columns: repeat(2,1fr); }
        }

        /* ─── TABS ─── */
        .tabs-nav {
            display: flex;
            gap: 4px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tabs-nav::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 1;
            min-width: fit-content;
            white-space: nowrap;
            padding: 9px 16px;
            background: transparent;
            border: none;
            border-radius: 9px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn:hover { color: var(--text); background: var(--surface2); }
        .tab-btn.active {
            background: var(--accent);
            color: white;
        }
        .tab-badge {
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 1px 6px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .tab-btn:not(.active) .tab-badge {
            background: var(--border);
            color: var(--text-muted);
        }

        /* ─── TAB PANES ─── */
        .tab-pane { display: none; }
        .tab-pane.active { display: block; animation: fadeSlide 0.25s ease; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ─── CARD ─── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .card-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            gap: 10px;
            flex-wrap: wrap;
        }
        .card-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-accent-bar {
            width: 3px;
            height: 16px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .card-actions { display: flex; align-items: center; gap: 6px; }
        .history-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px;
            background: var(--surface2, #1a1f2e);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .history-bar label { font-size: 0.75rem; color: var(--text-muted); }
        .history-bar input[type=date] {
            background: var(--bg, #0d1117);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 10px;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
        }
        .history-bar button {
            background: var(--accent);
            color: #fff; border: none; border-radius: 8px;
            padding: 6px 12px; font-size: 0.78rem; cursor: pointer;
        }
        .history-banner {
            display: none;
            padding: 10px 20px;
            background: rgba(233,196,106,0.12);
            border-bottom: 1px solid var(--amber, #e9c46a);
            font-size: 0.82rem;
            color: var(--amber, #e9c46a);
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .history-banner.visible { display: flex; }
        .history-banner button {
            background: none; border: 1px solid var(--amber, #e9c46a);
            color: var(--amber, #e9c46a); border-radius: 8px;
            padding: 4px 10px; font-size: 0.75rem; cursor: pointer;
        }
        .hist-chart-wrap {
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .hist-chart-title {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
        }
        .hist-chart-svg { width: 100%; height: auto; display: block; }
        .hist-chart-tooltip {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
        }
        .hist-series-toggle {
            display: flex; gap: 8px; flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .hist-series-btn {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }
        .hist-series-btn.active {
            border-color: currentColor;
        }
        .hist-table-wrap { overflow-x: auto; }
        .hist-table-wrap table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .hist-table-wrap th {
            text-align: right;
            padding: 8px 10px;
            color: var(--text-muted);
            font-size: 0.68rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .hist-table-wrap th:first-child { text-align: left; }
        .hist-table-wrap td {
            text-align: right;
            padding: 7px 10px;
            font-family: 'Space Mono', monospace;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            white-space: nowrap;
        }
        .hist-table-wrap td:first-child { text-align: left; font-family: inherit; }
        .hist-table-wrap tr:hover td { background: rgba(255,255,255,0.02); }
        .hist-delta.pos { color: var(--green); }
        .hist-delta.neg { color: var(--red); }
        .collapse-btn { background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:0.85rem; padding:2px 6px; border-radius:4px; transition:transform 0.25s, color 0.2s; line-height:1; }
        .collapse-btn:hover { color:var(--text); }
        .collapse-btn.collapsed { transform: rotate(-90deg); }
        .card-body { transition: none; }
        .card-body.collapsed { display: none; }

        /* ─── TABLE ─── */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; }
        th {
            padding: 9px 14px;
            text-align: left;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            background: var(--surface);
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }
        th:hover { color: var(--text-muted); }
        td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.87rem;
            color: var(--text);
        }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        .mono { font-family: 'Space Mono', monospace; font-size: 0.82rem; white-space: nowrap; }
        .pos { color: var(--green) !important; font-weight: 600; }
        .neg { color: var(--red) !important; font-weight: 600; }
        .subtotal-row td { background: rgba(59,130,246,0.06); color: var(--accent-bright); font-weight: 700; font-size: 0.82rem; }
        tfoot td {
            background: var(--surface2);
            font-weight: 700;
            font-size: 0.82rem;
            border-top: 1px solid var(--border-bright);
            border-bottom: none;
        }

        /* ─── CARD FOOTER ─── */
        .card-footer {
            padding: 12px 18px;
            text-align: right;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            background: var(--surface2);
            border-top: 1px solid var(--border);
            color: var(--accent-bright);
        }

        /* ─── FORM ELEMENTS ─── */
        input.edit-in {
            background: var(--surface3);
            border: 1px solid var(--border-bright);
            color: var(--text) !important;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'Sora', sans-serif;
            width: 100%;
            box-sizing: border-box;
        }
        input.edit-in:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        /* ─── BUTTONS ─── */
        .btn-tool {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 6px;
            border-radius: 6px;
            color: var(--text-muted);
            transition: all 0.15s;
        }
        .btn-tool:hover { background: var(--surface3); color: var(--text); }
        .btn-save {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .btn-save:hover { background: var(--accent-bright); }
        .btn-add {
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
        }
        .btn-add:hover { background: rgba(16,185,129,0.25); }
        .btn-del {
            background: none;
            border: none;
            color: var(--red);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 4px;
            opacity: 0.7;
        }
        .btn-del:hover { opacity: 1; }
        .hidden { display: none !important; }

        /* ─── MARGIN ROW ─── */
        .margin-row td { background: var(--red-dim); color: var(--red) !important; }
        .margin-row input.edit-in {
            color: var(--red) !important;
            font-weight: 700;
            text-align: right;
        }

        /* ─── MOBILE CARDS ─── */
        @media (max-width: 640px) {
            .tabs-nav { gap: 2px; }
            .tab-btn { padding: 8px 10px; font-size: 0.75rem; }
            .table-wrap { overflow-x: hidden; }
            table, thead, tbody, tfoot, th, td, tr { display: block; }
            thead tr { display: none; }
            tbody tr {
                margin-bottom: 12px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--surface);
                padding: 12px 14px;
            }
            tbody tr:hover { background: var(--surface2); }
            tbody td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border: none;
                padding: 5px 0;
                border-bottom: 1px solid var(--border);
                gap: 8px;
            }
            tbody td > * { white-space: nowrap; }
            tbody td.mono {
                min-width: 0;
            }
            tbody td.mono span {
                margin-left: auto;
                font-variant-numeric: tabular-nums;
                font-feature-settings: "tnum";
                text-align: right;
                display: inline-block;
                white-space: nowrap;
            }

            tbody td:last-child { border-bottom: none; }
            tbody td:first-child {
                font-size: 1rem;
                font-weight: 700;
                padding-bottom: 10px;
                margin-bottom: 4px;
            }
            tbody td::before {
                content: attr(data-label);
                font-size: 0.65rem;
                color: var(--text-dim);
                font-weight: 600;
                letter-spacing: 0.5px;
                text-transform: uppercase;
            }
            .subtotal-row { border-radius: 6px !important; margin-bottom: 4px !important; }
            /* tfoot: show as compact summary rows */
            tfoot tr {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 14px;
                border-top: 1px solid var(--border-bright);
                background: var(--surface2);
                flex-wrap: wrap;
                gap: 4px 12px;
            }
            tfoot td {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                border: none;
                padding: 2px 0;
                background: transparent !important;
                font-size: 0.8rem;
            }
            tfoot td[colspan] { flex: 1 1 100%; color: var(--text-muted) !important; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
            tfoot td:last-child { margin-left: auto; font-weight: 700; }
            tfoot td { white-space: nowrap; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="header-label">Patrimonio Consolidado — Martín</div>
        <div class="header-total" id="total-general">$ 0,00</div>
        <div id="header-dc" class="header-dc">—</div>
        <div class="header-gan" id="header-gan-label">GANANCIA USD</div>
        <div class="header-gan-total" id="header-gan-total">$ 0,00</div>
        <div id="header-gan-pct" class="header-gan-pct">—</div>
        <div class="header-meta">
            <div id="sync-info">Sincronizando...</div>
            <button class="header-refresh" onclick="fetchData()">↻ Actualizar</button>
        </div>
    </div>

    <!-- HISTORY BAR -->
    <div class="history-bar">
        <label>📅 Ver tenencia al:</label>
        <input type="date" id="history-date">
        <button onclick="viewHistoryDate()">Ver</button>
    </div>
    <div class="history-banner" id="history-banner">
        <span id="history-banner-text"></span>
        <button onclick="exitHistoryView()">Volver a hoy</button>
    </div>

    <!-- SUMMARY PILLS -->
    <div class="summary-strip" id="summary-strip">
        <div class="sum-pill">
            <div class="sum-pill-label">Acciones</div>
            <div class="sum-pill-val" id="sum-stocks">—</div>
        </div>
        <div class="sum-pill">
            <div class="sum-pill-label">Fondos AR</div>
            <div class="sum-pill-val" id="sum-fci">—</div>
        </div>
        <div class="sum-pill">
            <div class="sum-pill-label">Mutual Funds</div>
            <div class="sum-pill-val" id="sum-mutual">—</div>
        </div>
        <div class="sum-pill">
            <div class="sum-pill-label">Otros Activos</div>
            <div class="sum-pill-val" id="sum-otros">—</div>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs-nav" id="tabs-nav">
        <button class="tab-btn active" data-tab="tab-all" onclick="switchTab(this)">
            🌐 Todo
        </button>
        <button class="tab-btn" data-tab="tab-stocks" onclick="switchTab(this)">
            📈 Acciones
        </button>
        <button class="tab-btn" data-tab="tab-fci" onclick="switchTab(this)">
            🇦🇷 Fondos AR
        </button>
        <button class="tab-btn" data-tab="tab-mutual" onclick="switchTab(this)">
            🏦 Mutual
        </button>
        <button class="tab-btn" data-tab="tab-otros" onclick="switchTab(this)">
            💼 Otros
        </button>
        <button class="tab-btn" data-tab="tab-historico" onclick="switchTab(this)">
            📊 Histórico
        </button>
    </div>

    <!-- TAB PANES -->
    <div id="tab-all" class="tab-pane active">
        <div id="all-container"></div>
    </div>
    <div id="tab-stocks" class="tab-pane">
        <div id="stocks-container"></div>
    </div>
    <div id="tab-fci" class="tab-pane">
        <div id="fci-container"></div>
    </div>
    <div id="tab-mutual" class="tab-pane">
        <div id="mutual-container"></div>
    </div>
    <div id="tab-otros" class="tab-pane">
        <div id="otros-container"></div>
    </div>
    <div id="tab-historico" class="tab-pane">
        <div id="historico-container"></div>
    </div>

</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVRSqK1Jm_fCtH2f7bicE7hYIdhiM00ZAzJHR7ubhGg8htXsLF709TQv1cpjIDWHJrLA/exec";
    let margin = 0; // se carga desde la sheet (CONFIG) en fetchData()
    let db = { main: [], otros: [], extra: [], historico: [] };
    // ─── COLLAPSE ───
    const collapseState = JSON.parse(localStorage.getItem('martin_collapse') || '{}');
    function saveCollapse() { localStorage.setItem('martin_collapse', JSON.stringify(collapseState)); }
    function collapseToggle(btn, key) {
        collapseState[key] = !collapseState[key];
        saveCollapse();
        const body = btn.closest('.card').querySelector('.card-body');
        body.classList.toggle('collapsed', collapseState[key]);
        btn.classList.toggle('collapsed', collapseState[key]);
    }
    function collapseBtn(key) {
        const c = collapseState[key] || false;
        return `<button class="collapse-btn ${c ? 'collapsed' : ''}" onclick="collapseToggle(this,'${key}')" title="Colapsar">▼</button>`;
    }
    function tableBody(key, tableHtml) {
        const c = collapseState[key] || false;
        return `<div class="card-body${c ? ' collapsed' : ''}">${tableHtml}</div>`;
    }

    let editModes = { STOCKS: false, Otros: false };
    let sortConfig = { key: 'sub', asc: false };
    let otrosSort = { key: 'monto', asc: false };
    let changedMain = false;
    const fmt = (v) => (v || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    // Para celdas de variación: agrega espacio antes de positivos para que los dígitos alineen con negativos
    const fmtSigned = (v, prefix='') => {
        const s = prefix + fmt(Math.abs(v || 0));
        return v >= 0 ? '\u2002' + s : '-' + s;  // \u2002 = en-space, similar ancho al guión en monospace
    };
    const fmtPct = (v) => v >= 0 ? '\u2002' + fmt(Math.abs(v)) + '%' : fmt(v) + '%';

    // ─── HISTÓRICO: TABLA + GRÁFICO ───
    let histSeries = { total: true, stocks: false, fci: false, mutual: false, otros: false };
    const histColors = { total: '#60a5fa', stocks: '#10b981', fci: '#f59e0b', mutual: '#a78bfa', otros: '#64748b' };
    const histLabels = { total: 'Total', stocks: 'Acciones', fci: 'Fondos AR', mutual: 'Mutual Funds', otros: 'Otros' };

    function toggleHistSeries(key) {
        histSeries[key] = !histSeries[key];
        renderHistorico();
    }

    function renderHistorico() {
        const container = document.getElementById('historico-container');
        const hist = [...(db.historico || [])].sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

        if (hist.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); padding:20px">Todavía no hay snapshots guardados. Se generan automáticamente todos los días a las 18:05.</p>';
            return;
        }

        // Toggle buttons
        const toggles = Object.keys(histLabels).map(key => {
            const active = histSeries[key];
            const color = histColors[key];
            return `<button class="hist-series-btn ${active ? 'active' : ''}" style="color:${active ? color : 'var(--text-muted)'}" onclick="toggleHistSeries('${key}')">● ${histLabels[key]}</button>`;
        }).join('');

        // Chart dimensions
        const W = 900, H = 280, PAD_L = 60, PAD_R = 20, PAD_T = 20, PAD_B = 30;
        const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;

        const activeKeys = Object.keys(histSeries).filter(k => histSeries[k]);
        const allVals = activeKeys.length
            ? hist.flatMap(h => activeKeys.map(k => parseFloat(h[k]) || 0))
            : [0];
        const maxVal = Math.max(...allVals, 1);
        const minVal = Math.min(0, ...allVals);

        const xForIdx = i => hist.length > 1 ? PAD_L + (i / (hist.length - 1)) * plotW : PAD_L + plotW / 2;
        const yForVal = v => PAD_T + plotH - ((v - minVal) / (maxVal - minVal || 1)) * plotH;

        let svgLines = '';
        activeKeys.forEach(key => {
            const pts = hist.map((h, i) => `${xForIdx(i)},${yForVal(parseFloat(h[key]) || 0)}`).join(' ');
            const color = histColors[key];
            svgLines += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" />`;
            hist.forEach((h, i) => {
                svgLines += `<circle cx="${xForIdx(i)}" cy="${yForVal(parseFloat(h[key]) || 0)}" r="3" fill="${color}"><title>${h.fecha}: $ ${fmt(parseFloat(h[key]) || 0)}</title></circle>`;
            });
        });

        // Grid lines (horizontal, 4 steps) + y labels
        let gridLines = '', yLabels = '';
        for (let i = 0; i <= 4; i++) {
            const v = minVal + (maxVal - minVal) * (i / 4);
            const y = yForVal(v);
            gridLines += `<line x1="${PAD_L}" y1="${y}" x2="${W - PAD_R}" y2="${y}" stroke="var(--border)" stroke-width="1" />`;
            yLabels += `<text x="${PAD_L - 8}" y="${y + 4}" text-anchor="end" fill="var(--text-muted)" font-size="10" font-family="Space Mono, monospace">${fmtShort(v)}</text>`;
        }

        // X labels (first, middle, last date)
        let xLabels = '';
        const labelIdxs = hist.length > 1 ? [0, Math.floor((hist.length - 1) / 2), hist.length - 1] : [0];
        [...new Set(labelIdxs)].forEach(i => {
            xLabels += `<text x="${xForIdx(i)}" y="${H - 8}" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Space Mono, monospace">${hist[i].fecha.slice(5)}</text>`;
        });

        const svg = `<svg class="hist-chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
            ${gridLines}${yLabels}${xLabels}${svgLines}
        </svg>`;

        // Table rows, most recent first
        const rowsHtml = [...hist].reverse().map((h, idx, arr) => {
            const prev = arr[idx + 1];
            const delta = prev ? h.total - prev.total : null;
            const deltaHtml = delta !== null
                ? `<span class="hist-delta ${delta >= 0 ? 'pos' : 'neg'}">${delta >= 0 ? '+' : ''}$ ${fmt(delta)}</span>`
                : '<span style="color:var(--text-dim)">—</span>';
            return `<tr>
                <td>${h.fecha}</td>
                <td>$ ${fmt(h.stocks)}</td>
                <td>$ ${fmt(h.fci)}</td>
                <td>$ ${fmt(h.mutual)}</td>
                <td>$ ${fmt(h.otros)}</td>
                <td style="font-weight:600">$ ${fmt(h.total)}</td>
                <td>${deltaHtml}</td>
            </tr>`;
        }).join('');

        container.innerHTML = `
            <div class="hist-chart-wrap">
                <div class="hist-chart-title">Evolución histórica</div>
                <div class="hist-series-toggle">${toggles}</div>
                ${svg}
            </div>
            <div class="hist-table-wrap">
                <table>
                    <thead><tr>
                        <th style="text-align:left">Fecha</th>
                        <th>Acciones</th><th>Fondos AR</th><th>Mutual Funds</th><th>Otros</th><th>Total</th><th>Var. vs día ant.</th>
                    </tr></thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>
        `;
    }

    function fmtShort(v) {
        if (Math.abs(v) >= 1000) return (v / 1000).toFixed(0) + 'k';
        return fmt(v);
    }

    function switchTab(btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
    }

    async function fetchData() {
        document.getElementById('sync-info').innerText = "Sincronizando...";
        try {
            const res = await fetch(SCRIPT_URL);
            db = await res.json();
            if (!db.otros || db.otros.length === 0) {
                db.otros = [["Pension Plan", 55000], ["Bonus", 40000], ["Caja Seguridad (Lagartos)", 20700], ["Caja Seguridad (Bebu)", 28000]];
            }
            margin = parseFloat(db.margin) || 0;
            render();
            renderHistorico();
            const now = new Date();
            document.getElementById('sync-info').innerText = `Sync ✓ ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
        } catch (e) {
            document.getElementById('sync-info').innerText = "Error de sincronización ✗";
        }
    }

    // ─── VISTA HISTÓRICA ───
    function viewHistoryDate() {
        const dateInput = document.getElementById('history-date').value;
        if (!dateInput) return;
        const hist = (db.historico || []).find(h => h.fecha === dateInput);
        const banner = document.getElementById('history-banner');
        const bannerText = document.getElementById('history-banner-text');

        if (!hist) {
            banner.classList.add('visible');
            banner.style.background = 'rgba(193,18,31,0.12)';
            banner.style.borderColor = 'var(--red)';
            bannerText.style.color = 'var(--red)';
            bannerText.innerText = `⚠️ No hay snapshot guardado para ${dateInput}.`;
            return;
        }

        banner.classList.add('visible');
        banner.style.background = 'rgba(233,196,106,0.12)';
        banner.style.borderColor = 'var(--amber, #e9c46a)';
        bannerText.style.color = 'var(--amber, #e9c46a)';
        bannerText.innerHTML = `📅 Viendo tenencia del <b>${dateInput}</b> — Total: <b>$ ${fmt(hist.total)}</b>`;

        document.getElementById('total-general').innerText = `$ ${fmt(hist.total)}`;
        document.getElementById('header-dc').innerHTML = `<span style="color:var(--text-muted)">Snapshot histórico — no refleja variación diaria</span>`;
        document.getElementById('header-gan-total').innerText = '—';
        document.getElementById('header-gan-total').className = 'header-gan-total';
        document.getElementById('header-gan-pct').innerHTML = `<span style="color:var(--text-muted)">No disponible en vista histórica</span>`;

        document.getElementById('sum-stocks').innerHTML = `<span class="mono">$ ${fmt(hist.stocks)}</span>`;
        document.getElementById('sum-fci').innerHTML    = `<span class="mono">$ ${fmt(hist.fci)}</span>`;
        document.getElementById('sum-mutual').innerHTML = `<span class="mono">$ ${fmt(hist.mutual)}</span>`;
        document.getElementById('sum-otros').innerHTML  = `<span class="mono">$ ${fmt(hist.otros)}</span>`;
    }

    function exitHistoryView() {
        document.getElementById('history-banner').classList.remove('visible');
        document.getElementById('history-date').value = '';
        render();
    }

    async function saveMargin(val) {
        document.getElementById('sync-info').innerText = "Guardando margen...";
        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ type: 'MARGIN', data: { value: val } }) });
            document.getElementById('sync-info').innerText = "Margen guardado ✓";
        } catch (e) {
            document.getElementById('sync-info').innerText = "Error al guardar margen ✗";
        }
    }

    async function saveData(type) {
        document.getElementById('sync-info').innerText = "Guardando...";
        let data;
        if (type === 'OTROS') data = db.otros.map(i => ({ n: i[0], v: i[1] }));
        else if (type === 'EXTRA') data = db.extra.map(i => ({ n: i[0], q: i[1], p: i[2], dc_v: i[3], dc_p: i[4] }));
        else if (type === 'MAIN') data = db.main;
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ type, data }) });
    }

    async function saveStocks() {
        await saveData('EXTRA');
        if (changedMain) { await saveData('MAIN'); changedMain = false; }
        editModes.STOCKS = false;
        fetchData();
    }

    async function saveOtros() {
        await saveData('OTROS');
        editModes.Otros = false;
        fetchData();
    }

    function toggleEdit(sec) { editModes[sec] = !editModes[sec]; render(); }

    function addRow(type) {
        if (type === 'OTROS') db.otros.push(["Nuevo", 0]);
        else db.extra.push(["NUEVA", 0, 0, 0, 0, "STOCKS"]);
        render();
    }

    function delRow(type, i) {
        if (confirm('¿Eliminar fila?')) {
            db[type.toLowerCase()].splice(i, 1);
            if (type === 'MAIN') changedMain = true;
            render();
        }
    }

    function setSort(k) {
        sortConfig.asc = sortConfig.key === k ? !sortConfig.asc : false;
        sortConfig.key = k;
        render();
    }

    function setOtrosSort(k) {
        if (otrosSort.key === k) otrosSort.asc = !otrosSort.asc;
        else { otrosSort.key = k; otrosSort.asc = k === 'nombre'; }
        render();
    }

    function updateVal(type, i, col, val) {
        db[type.toLowerCase()][i][col] = col === 0 ? val : (parseFloat(val) || 0);
    }

    function updateNombre(source, index, val) {
        if (source === 'extra') db.extra[index][0] = val;
        else if (source === 'main') { db.main[index][0] = val; changedMain = true; }
        render();
    }

    function updateCantidad(source, index, val) {
        const newQ = parseFloat(val) || 0;
        if (source === 'extra') db.extra[index][1] = newQ;
        else if (source === 'main') { db.main[index][1] = newQ; changedMain = true; }
        render();
    }

    // ─── BUILD STOCK CARD HTML ───
    function buildStocksCard(data) {
        const sorted = [...data].sort((a, b) => (sortConfig.asc ? 1 : -1) * (a[sortConfig.key] > b[sortConfig.key] ? 1 : -1));
        let sub = 0, dc = 0;
        const rows = sorted.map(i => {
            sub += i.sub; dc += i.dc_v;
            const canEdit = editModes.STOCKS;
            const index = i.source === 'main' ? i.origIndex : i.idx;
            return `<tr>
                <td data-label="Activo">${canEdit ? `<input class="edit-in" value="${i.n}" onchange="updateNombre('${i.source}', ${index}, this.value)">` : `<b>${i.n}</b>`}</td>
                <td data-label="Cant" class="mono">${canEdit ? `<input type="number" class="edit-in" value="${i.q}" onchange="updateCantidad('${i.source}', ${index}, this.value)">` : `<span>${i.q.toLocaleString()}</span>`}</td>
                <td data-label="Precio" class="mono"><span>$ ${i.p.toFixed(2)}</span></td>
                <td data-label="Día $" class="mono ${i.dc_v >= 0 ? 'pos' : 'neg'}"><span>${fmtSigned(i.dc_v, '$ ')}</span></td>
                <td data-label="Día %" class="mono ${i.dc_p >= 0 ? 'pos' : 'neg'}"><span>${fmtPct(i.dc_p)}</span></td>
                <td data-label="Total" class="mono" style="text-align:right"><span>$ ${fmt(i.sub)}</span> ${canEdit ? `<button class="btn-del" onclick="delRow('${i.source === 'extra' ? 'EXTRA' : 'MAIN'}', ${index})">×</button>` : ''}</td>
            </tr>`;
        }).join('');
        // sub = bruto de acciones; net = sub + margin (margen es negativo)
        const net = sub + margin;
        const pct = sub !== 0 ? (dc / sub * 100) : 0;
        const edit = editModes.STOCKS;
        return `<div class="card">
            <div class="card-header" style="cursor:pointer" onclick="if(!event.target.closest('button'))collapseToggle(this.querySelector('.collapse-btn'),'stocks')">
                <div class="card-title">
                    <div class="card-accent-bar" style="background:var(--accent)"></div>
                    📈 Acciones
                </div>
                <div class="card-actions">
                    ${edit ? `<button class="btn-add" onclick="addRow('EXTRA')">+ Agregar</button><button class="btn-save" onclick="saveStocks()">Guardar</button>` : ''}
                    <button class="btn-tool" onclick="toggleEdit('STOCKS')" title="Editar">✏️</button>
                    ${collapseBtn('stocks')}
                </div>
            </div>
            ${tableBody('stocks', `<div class="table-wrap">
                <table>
                    <thead><tr>
                        <th onclick="setSort('n')">Activo ↕</th>
                        <th onclick="setSort('q')">Cant ↕</th>
                        <th>Precio</th>
                        <th onclick="setSort('dc_v')">Día $ ↕</th>
                        <th onclick="setSort('dc_p')">Día % ↕</th>
                        <th onclick="setSort('sub')" style="text-align:right">Total ↕</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" style="text-align:right; color:var(--text-muted)">TOTAL DÍA</td>
                            <td class="mono ${dc >= 0 ? 'pos' : 'neg'}">$ ${fmt(dc)}</td>
                            <td class="mono ${dc >= 0 ? 'pos' : 'neg'}">${pct.toFixed(2)}%</td>
                            <td class="mono" style="text-align:right">$ ${fmt(sub)}</td>
                        </tr>
                        <tr class="margin-row">
                            <td colspan="5" style="text-align:right; color:var(--red)">MARGEN / DEUDA</td>
                            <td style="text-align:right">
                                <input type="text" class="edit-in" id="margin-input" style="width:140px; text-align:right; color:var(--red); font-weight:700; font-family:'Space Mono',monospace;"
                                    value="${fmt(margin)}"
                                    onfocus="this.value=margin; this.type='number';"
                                    onblur="this.type='text'; margin=parseFloat(this.value)||0; this.value=fmt(margin); render(); saveMargin(margin);"
                                    onkeydown="if(event.key==='Enter'){this.blur();}">
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>`)}
            <div class="card-footer">Subtotal Acciones (neto): $ ${fmt(net)}</div>
        </div>`;
    }

    // ─── BUILD FCI CARD HTML ───
    function buildFciCard(data) {
        const g1 = data.filter(f => !f.n.toUpperCase().includes("GALICIA"));
        const g2 = data.filter(f => f.n.toUpperCase().includes("GALICIA"));
        let tSub = 0, tDc = 0, tGan = 0;
        const processGroup = (list, label) => {
            let lSub = 0, lDc = 0, lGan = 0;
            let h = list.map(i => {
                lSub += i.sub; lDc += i.dc_v;
                const gan = i.costo ? (i.p - i.costo) * i.q : null;
                const ganPct = (i.costo && i.costo !== 0) ? ((i.p - i.costo) / i.costo * 100) : null;
                if (gan !== null) lGan += gan;
                const ganHtml = gan !== null
                    ? `<span class="${gan >= 0 ? 'pos' : 'neg'}">${fmtSigned(gan, '$ ')} (${fmtPct(ganPct)})</span>`
                    : `<span style="color:var(--text-dim)">—</span>`;
                return `<tr><td data-label="Fondo">${i.n}</td><td data-label="Cuotas" class="mono"><span>${i.q.toLocaleString()}</span></td><td data-label="VCP" class="mono"><span>$ ${i.p.toFixed(6)}</span></td><td data-label="Día $" class="mono ${i.dc_v >= 0 ? 'pos' : 'neg'}"><span>${fmtSigned(i.dc_v, '$ ')}</span></td><td data-label="Día %" class="mono ${i.dc_p >= 0 ? 'pos' : 'neg'}"><span>${fmtPct(i.dc_p)}</span></td><td data-label="Ganancia" class="mono">${ganHtml}</td><td data-label="Total" class="mono" style="text-align:right"><span>$ ${fmt(i.sub)}</span></td></tr>`;
            }).join('');
            tSub += lSub; tDc += lDc; tGan += lGan;
            const subPct = (lSub - lDc) !== 0 ? lDc / (lSub - lDc) * 100 : 0;
            return h + `<tr class="subtotal-row"><td colspan="4">SUBTOTAL ${label}</td><td class="mono ${lDc >= 0 ? 'pos' : 'neg'}"><span>${fmtPct(subPct)}</span></td><td class="mono ${lGan >= 0 ? 'pos' : 'neg'}"><span>$ ${fmt(lGan)}</span></td><td class="mono" style="text-align:right"><span>$ ${fmt(lSub)}</span></td></tr>`;
        };
        const rows = processGroup(g1, "OTROS FCI") + (g2.length > 0 ? processGroup(g2, "GALICIA") : "");
        return `<div class="card">
            <div class="card-header" style="cursor:pointer" onclick="if(!event.target.closest('button'))collapseToggle(this.querySelector('.collapse-btn'),'fci')">
                <div class="card-title">
                    <div class="card-accent-bar" style="background:var(--green)"></div>
                    🇦🇷 Fondos Argentina
                </div>
                <div class="card-actions">${collapseBtn('fci')}</div>
            </div>
            ${tableBody('fci', `<div class="table-wrap">
                <table>
                    <thead><tr><th>Fondo</th><th>Cuotas</th><th>VCP</th><th>Día $</th><th>Día %</th><th>Ganancia Acum.</th><th style="text-align:right">Total</th></tr></thead>
                    <tbody>${rows}</tbody>
                    <tfoot><tr>
                        <td colspan="3" style="text-align:right; color:var(--text-muted)">TOTAL DÍA</td>
                        <td class="mono ${tDc >= 0 ? 'pos' : 'neg'}">$ ${fmt(tDc)}</td>
                        <td class="mono ${tDc >= 0 ? 'pos' : 'neg'}">${tSub !== 0 ? (tDc / tSub * 100).toFixed(2) : '0.00'}%</td>
                        <td class="mono ${tGan >= 0 ? 'pos' : 'neg'}">$ ${fmt(tGan)}</td>
                        <td class="mono" style="text-align:right">$ ${fmt(tSub)}</td>
                    </tr></tfoot>
                </table>
            </div>`)}
            <div class="card-footer">Subtotal Fondos AR: $ ${fmt(tSub)} &nbsp;·&nbsp; Ganancia: <span class="${tGan >= 0 ? 'pos' : 'neg'}">$ ${fmt(tGan)}</span></div>
        </div>`;
    }

    // ─── BUILD MUTUAL CARD HTML ───
    function buildMutualCard(label, color, data) {
        let sub = 0, dc = 0;
        const rows = data.map(i => { sub += i.sub; dc += i.dc_v; return `<tr><td data-label="Fondo">${i.n}</td><td data-label="Cuotas" class="mono"><span>${i.q.toLocaleString()}</span></td><td data-label="Precio" class="mono"><span>$ ${i.p.toFixed(2)}</span></td><td data-label="Día $" class="mono ${i.dc_v >= 0 ? 'pos' : 'neg'}"><span>${fmtSigned(i.dc_v, '$ ')}</span></td><td data-label="Día %" class="mono ${i.dc_p >= 0 ? 'pos' : 'neg'}"><span>${fmtPct(i.dc_p)}</span></td><td data-label="Total" class="mono" style="text-align:right"><span>$ ${fmt(i.sub)}</span></td></tr>`; }).join('');
        const mutualKey = label.replace(/[^a-z0-9]/gi,'_').toLowerCase();
        return `<div class="card">
            <div class="card-header" style="cursor:pointer" onclick="if(!event.target.closest('button'))collapseToggle(this.querySelector('.collapse-btn'),'${mutualKey}')">
                <div class="card-title">
                    <div class="card-accent-bar" style="background:${color}"></div>
                    ${label}
                </div>
                <div class="card-actions">${collapseBtn(mutualKey)}</div>
            </div>
            ${tableBody(mutualKey, `<div class="table-wrap">
                <table>
                    <thead><tr><th>Fondo</th><th>Cuotas</th><th>Precio</th><th>Día $</th><th>Día %</th><th style="text-align:right">Total</th></tr></thead>
                    <tbody>${rows}</tbody>
                    <tfoot><tr>
                        <td colspan="3" style="text-align:right; color:var(--text-muted)">TOTAL DÍA</td>
                        <td class="mono ${dc >= 0 ? 'pos' : 'neg'}">$ ${fmt(dc)}</td>
                        <td class="mono ${dc >= 0 ? 'pos' : 'neg'}">${sub !== 0 ? (dc / sub * 100).toFixed(2) : '0.00'}%</td>
                        <td class="mono" style="text-align:right">$ ${fmt(sub)}</td>
                    </tr></tfoot>
                </table>
            </div>`)}
            <div class="card-footer">Subtotal: $ ${fmt(sub)}</div>
        </div>`;
    }

    // ─── BUILD OTROS CARD HTML ───
    function buildOtrosCard(data) {
        const sorted = [...data].sort((a, b) => {
            if (otrosSort.key === 'nombre') return otrosSort.asc ? a.n.localeCompare(b.n) : b.n.localeCompare(a.n);
            return otrosSort.asc ? a.v - b.v : b.v - a.v;
        });
        let oSub = 0;
        const rows = sorted.map((item, i) => {
            const origIdx = item.idx;
            oSub += item.v;
            const edit = editModes.Otros;
            return `<tr>
                <td data-label="Concepto">${edit ? `<input class="edit-in" value="${item.n}" onchange="updateVal('OTROS',${origIdx},0,this.value)">` : `<b>${item.n}</b>`}</td>
                <td data-label="Monto" class="mono" style="text-align:right">${edit ? `<input type="number" class="edit-in" style="text-align:right" value="${item.v}" onchange="updateVal('OTROS',${origIdx},1,this.value)">` : `<span>$ ${fmt(item.v)}</span>`}</td>
                <td class="${edit ? '' : 'hidden'}">${edit ? `<button class="btn-del" onclick="delRow('OTROS',${origIdx})">×</button>` : ''}</td>
            </tr>`;
        }).join('');
        const edit = editModes.Otros;
        return `<div class="card">
            <div class="card-header" style="cursor:pointer" onclick="if(!event.target.closest('button'))collapseToggle(this.querySelector('.collapse-btn'),'otros')">
                <div class="card-title">
                    <div class="card-accent-bar" style="background:var(--slate)"></div>
                    💼 Otros Activos
                </div>
                <div class="card-actions">
                    ${edit ? `<button class="btn-add" onclick="addRow('OTROS')">+ Agregar</button><button class="btn-save" onclick="saveOtros()">Guardar</button>` : ''}
                    <button class="btn-tool" onclick="toggleEdit('Otros')">✏️</button>
                    ${collapseBtn('otros')}
                </div>
            </div>
            ${tableBody('otros', `<div class="table-wrap">
                <table>
                    <thead><tr>
                        <th onclick="setOtrosSort('nombre')">Concepto ↕</th>
                        <th onclick="setOtrosSort('monto')" style="text-align:right">Monto ↕</th>
                        <th class="${edit ? '' : 'hidden'}"></th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`)}
            <div class="card-footer">Subtotal Otros: $ ${fmt(oSub)}</div>
        </div>`;
    }

    // ─── RENDER ───
    function render() {
        let globalTotal = 0, globalDC = 0;
        let cats = { STOCKS: [], FCI: [], MARTIN: [], JORGE: [] };

        db.main.forEach((r, index) => {
            const cat = (r[6] || "").toUpperCase().trim();
            if (!cats[cat]) return;
            const q = parseFloat(r[1]) || 0, p = parseFloat(r[2]) || 0, dc_v = parseFloat(r[5]) || 0, dc_p = parseFloat(r[4]) || 0;
            const isFCI = cat === "FCI";
            const costo_raw = parseFloat(r[7]) || 0;
            const costo = isFCI ? costo_raw / 1000 : costo_raw;
            cats[cat].push({ n: r[0], q, p: isFCI ? p / 1000 : p, dc_v: isFCI ? dc_v / 1000 : dc_v, dc_p: Math.abs(dc_p) < 1.0 ? dc_p * 100 : dc_p, sub: isFCI ? (p * q) / 1000 : (p * q), costo, source: 'main', origIndex: index });
        });

        db.extra.forEach((r, idx) => {
            cats.STOCKS.push({ n: r[0], q: r[1], p: r[2], dc_v: r[3], dc_p: r[4], sub: r[1] * r[2], source: 'extra', idx });
        });

        // Compute totals
        const stocksNet = cats.STOCKS.reduce((s, i) => s + i.sub, 0) + margin;
        const fciSub    = cats.FCI.reduce((s, i) => s + i.sub, 0);
        const martinSub = cats.MARTIN.reduce((s, i) => s + i.sub, 0);
        const oSub      = (db.otros || []).reduce((s, i) => s + (parseFloat(i[1]) || 0), 0);

        const stocksDc = cats.STOCKS.reduce((s, i) => s + i.dc_v, 0);
        const fciDc    = cats.FCI.reduce((s, i) => s + i.dc_v, 0);
        const martinDc = cats.MARTIN.reduce((s, i) => s + i.dc_v, 0);

        globalTotal = stocksNet + fciSub + martinSub + oSub;
        globalDC    = stocksDc + fciDc + martinDc;

        // Ganancia acumulada (precio actual - costo) x cantidad, sobre items con costo cargado
        const allCosted = [...cats.STOCKS, ...cats.FCI, ...cats.MARTIN].filter(i => i.costo);
        const ganTotal   = allCosted.reduce((s, i) => s + (i.p - i.costo) * i.q, 0);
        const costoTotal = allCosted.reduce((s, i) => s + i.costo * i.q, 0);
        const ganPct     = costoTotal ? (ganTotal / costoTotal * 100) : 0;

        // Build cards
        const stocksHtml  = cats.STOCKS.length > 0 ? buildStocksCard(cats.STOCKS) : '';
        const fciHtml     = cats.FCI.length > 0    ? buildFciCard(cats.FCI)       : '';
        const martinHtml  = cats.MARTIN.length > 0 ? buildMutualCard("🏦 Mutual Funds — Martín", "var(--amber)", cats.MARTIN) : '';
        const jorgeHtml   = cats.JORGE.length > 0  ? buildMutualCard("🏦 Mutual Funds — Jorge (Info)", "var(--slate)", cats.JORGE) : '';
        const otrosData   = (db.otros || []).map((item, idx) => ({ idx, n: item[0], v: parseFloat(item[1]) || 0 }));
        const otrosHtml   = buildOtrosCard(otrosData);

        // Tab: Todo
        document.getElementById('all-container').innerHTML = stocksHtml + fciHtml + martinHtml + jorgeHtml + otrosHtml;
        document.getElementById('stocks-container').innerHTML = stocksHtml || '<p style="color:var(--text-muted); padding:20px">Sin datos de acciones.</p>';
        document.getElementById('fci-container').innerHTML   = fciHtml || '<p style="color:var(--text-muted); padding:20px">Sin datos de fondos.</p>';
        document.getElementById('mutual-container').innerHTML = martinHtml + jorgeHtml || '<p style="color:var(--text-muted); padding:20px">Sin datos de mutual funds.</p>';
        document.getElementById('otros-container').innerHTML  = otrosHtml;

        // Header
        document.getElementById('total-general').innerText = `$ ${fmt(globalTotal)}`;
        const gPct = (globalTotal - globalDC) !== 0 ? (globalDC / (globalTotal - globalDC) * 100) : 0;
        document.getElementById('header-dc').innerHTML = `<span class="${globalDC >= 0 ? 'pos' : 'neg'}">Cambio hoy: $ ${fmt(globalDC)} (${gPct.toFixed(2)}%)</span>`;

        const ganTotalEl = document.getElementById('header-gan-total');
        ganTotalEl.innerText = `$ ${fmt(ganTotal)}`;
        ganTotalEl.className = `header-gan-total ${ganTotal >= 0 ? 'pos' : 'neg'}`;
        document.getElementById('header-gan-pct').innerHTML = `<span class="${ganTotal >= 0 ? 'pos' : 'neg'}">${ganPct.toFixed(2)}%</span>`;

        // Pills
        document.getElementById('sum-stocks').innerHTML = `<span class="mono ${stocksNet > 0 ? '' : 'neg'}">$ ${fmt(stocksNet)}</span>`;
        document.getElementById('sum-fci').innerHTML    = `<span class="mono">$ ${fmt(fciSub)}</span>`;
        document.getElementById('sum-mutual').innerHTML = `<span class="mono">$ ${fmt(martinSub)}</span>`;
        document.getElementById('sum-otros').innerHTML  = `<span class="mono">$ ${fmt(oSub)}</span>`;
    }

    fetchData();
    setInterval(fetchData, 60000);
    document.getElementById('history-date').max = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
